name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.3.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check release version
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tag = os.environ['TAG']
          version = re.search(r'^const Version = "([^"]+)"$', Path('internal/levelup/api.go').read_text(), re.M)[1]
          manifest_version = json.loads(Path('mengka-plugin.json').read_text())['version']
          if tag != 'v' + version or manifest_version != version:
              raise SystemExit(f'Tag {tag}, plugin version {version}, and manifest version {manifest_version} must match.')
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', tag):
              raise SystemExit(f'Unsupported release tag: {tag}')
          PY
      - name: Test and build packages
        run: |
          go test -race ./...
          go vet ./...
          python3 scripts/package.py
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/ipc_smoke.py .build/linux-amd64/laoluo-levelup mengka-plugin.json
      - name: Publish packages to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$TAG" == v0.3.2 || "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          packages=(
            "dist/laoluo-levelup-$TAG-linux-amd64.zip"
            "dist/laoluo-levelup-$TAG-linux-arm64.zip"
            "dist/laoluo-levelup-$TAG-source.zip"
            dist/SHA256SUMS
          )
          notes_file="$RUNNER_TEMP/laoluo-release-notes.md"
          awk -v tag="$TAG" '
            /^## / {
              if (section) exit
              section = ($2 == tag)
            }
            section { print }
          ' CHANGELOG.md > "$notes_file"
          notes_flags=()
          if [[ -s "$notes_file" ]]; then
            notes_flags+=(--notes-file "$notes_file")
          fi
          if draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"; then
            if [[ "$draft" != true ]]; then
              echo "::error::A published release already exists for $TAG."
              exit 1
            fi
            gh release upload "$TAG" --clobber "${packages[@]}"
            gh release edit "$TAG" --draft=false "${release_flags[@]}" "${notes_flags[@]}"
          else
            if [[ ${#notes_flags[@]} -eq 0 ]]; then
              notes_flags+=(--generate-notes)
            fi
            gh release create "$TAG" --verify-tag --title "laoluo-levelup $TAG" \
              "${release_flags[@]}" "${notes_flags[@]}" "${packages[@]}"
          fi
